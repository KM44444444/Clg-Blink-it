<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive UI Design</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .main-container {
            min-height: 100vh;
            padding: 20px;

            background: #9bc29b;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-container {
            width: 355px;
            height: 430px;

            background: white;
            border-radius: 22px;
            overflow: hidden;
        }

        /* IMAGE */
        .image-container {
            height: 40%;

            display: flex;
            align-items: center;
            justify-content: center;

            background-color: #d0d0d0;
            overflow: hidden;
        }

        .image-container img {
            height: 100%;
            width: 75%;
            object-fit: contain;

            transition: 0.5s ease-in-out;
        }

        .image-container img:hover {
            scale: 1.2;
        }

        /* DESCRIPTION */
        .description-container {
            height: 30%;
            padding: 12px 20px;

            display: grid;
            grid-template-rows: auto 1fr auto;

            border-bottom: 1px solid #ddd;
        }

        .description-container h1 {
            margin: 0;
            font-size: 21px;
            font-family: Georgia, serif;
        }

        .description-container p {
            margin: 5px 0;
            font-size: 12px;
            line-height: 1.3;
            color: #333;
        }

        .description-container-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .description-container-btn button {
            border: 1px solid grey;
            border-radius: 5px;
            background: transparent;

            font-size: 20px;
            color: #444;

            padding: 2px 5px;
        }

        /* PRICE */
        .image-price {
            height: 15%;

            padding: 8px 12px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 10px;
        }

        .image-price h1 {
            margin: 0;
            font-size: 20px;
            font-family: Georgia, serif;
            white-space: nowrap;
        }

        .image-price h1 .old-price {
            font-size: 10px;
            font-weight: normal;
            text-decoration: line-through;
            color: #333;
        }

        .image-price h1 .new-price {
            font-size: 20px;
        }

        .image-price button {
            width: 58%;
            min-height: 28px;

            border: none;
            border-radius: 4px;

            background: linear-gradient(
                to right,
                #00d83a,
                #dfff00
            );

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;
        }

        @media (max-width: 768px) {

            .main-container {
                padding: 15px;
            }

            .card-container {
                width: 90%;
                max-width: 355px;
            }

        }


        @media (max-width: 480px) {

            .main-container {
                padding: 12px;
            }

            .card-container {
                width: 100%;
                max-width: 355px;
                height: 420px;

                border-radius: 18px;
            }

            .image-container {
                height: 38%;
            }

            .image-container img {
                width: 80%;
            }

            .description-container {
                height: 32%;
                padding: 10px 15px;
            }

            .description-container h1 {
                font-size: 19px;
            }

            .description-container p {
                font-size: 11px;
            }

            .description-container-btn {
                gap: 5px;
            }

            .description-container-btn button {
                font-size: 14px;
            }

            .image-price {
                height: 18%;
                padding: 8px 12px;
            }

            .image-price h1 {
                font-size: 17px;
            }

            .image-price h1 .new-price {
                font-size: 17px;
            }

            .image-price button {
                width: 55%;
                font-size: 9px;
            }
        }

        @media (max-width: 350px) {

            .card-container {
                height: 400px;
            }

            .description-container {
                padding: 8px 12px;
            }

            .description-container h1 {
                font-size: 17px;
            }

            .description-container p {
                font-size: 10px;
            }

            .description-container-btn button {
                font-size: 12px;
            }

            .image-price {
                padding: 6px 10px;
            }

            .image-price h1 {
                font-size: 15px;
            }

            .image-price h1 .new-price {
                font-size: 15px;
            }

            .image-price button {
                width: 52%;
                font-size: 8px;
            }
        }
    </style>
</head>

<body>

    <div class="main-container">

        <div class="card-container">

            <div class="image-container">
                <img 
                    src="https://th.bing.com/th/id/OIP.-F6naUYmy8RHLc5Wkx1vDwHaEK?w=329&h=184&c=7&r=0&o=7&pid=1.7&rm=3"
                    alt="Airpods Max"
                >
            </div>

            <div class="description-container">

                <h1>Boat Stone 1200F</h1>

                <p>
                    Lorem ipsum dolor sit amet consectetur,
                    adipisicing elit. Quos, animi.
                </p>

                <div class="description-container-btn">
                    <button>Green</button>
                    <button>Just the Device</button>
                </div>

            </div>

            <div class="image-price">

                <h1>
                    <span class="old-price">₹2000</span>
                    <span class="new-price">₹599</span>
                </h1>

                <button>+ Add to Cart</button>

            </div>

        </div>

    </div>

</body>
</html>
