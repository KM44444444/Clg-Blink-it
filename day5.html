<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery Store</title>

    <style>
        body {
            margin: 0;
            background-color: #f2f5f7;
            font-family: Arial, sans-serif;
        }

        .navbar {
            position: sticky;
            top: 0;
            height: 50px;
            background-color: #24558a;
            color: white;
            display: flex;
            align-items: center;
            padding-left: 30px;
        }
        .container1 {
            display: flex;
            justify-content: space-around;
            padding: 50px;
        }

        .box {
            width: 30%;
            height: 160px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);

            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container2 {
            display: flex;
            justify-content: space-around;
            padding: 40px;
        }
        .circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: linear-gradient(135deg, #168bc4, #219653);
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>
        <div class="navbar">NavBar</div>
        <div class="container1">
            <div class="box">Fresh Fruits</div>
            <div class="box">Vegetables</div>
            <div class="box">Daily Essentials</div>
        </div>
        <div class="container2">
            <div class="circle">Fruits</div>
            <div class="circle">Drinks</div>
            <div class="circle">Snacks</div>
            <div class="circle">Dairy</div>
        </div>
        <div style="background-color: aqua; height: 300px; width: 100%;"></div>
        <div style="background-color: rgb(67, 209, 42); height: 300px; width: 100%;"></div>
        <div style="background-color: rgb(171, 22, 99); height: 300px; width: 100%;"></div>

        </div>

            </div>
        </div>
    </div>

</body>
</html>
