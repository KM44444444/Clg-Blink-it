<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .container {
      height: 100vh;
      background-color: rgb(253, 255, 253);

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card-container {
      background-color: rgb(220, 146, 146);
      border: red;
      height: 90%;
      width: 25%;
      display: flex;
      justify-content: center;
      margin: auto;
    }
    .box {
      background-color: rgb(161, 21, 21);
      border: rgb(24, 183, 45);
      height: 40%;
      width: 80%;
      margin: 30px;
    }
  </style>

  <body>
    <div class="container">
      <div class="card-container">
        <div class="box"></div>
      </div>
    </div>
  </body>
</html>
